{{ define "content" }}
<section class="card">
    <h2>Start training</h2>
    <p class="muted">Choose a mode and begin a short review session.</p>

    <div class="mode_grid">
        {{ range .Modes }}
        <a class="mode_button" href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
    </div>
</section>

<section class="card">
    <h2>Topics</h2>
    <p class="muted">Topics loaded from SQLite.</p>

    <ul class="topic_list">
        {{ range .Topics }}
        <li>
            <a class="topic_item" href="/topics/{{ .Name }}">{{ .Name }}</a>
        </li>
        {{ else }}
        <li class="muted">No topics yet.</li>
        {{ end }}
    </ul>

    <div class="page_actions">
        <a class="secondary_link" href="/topics">Open topics page →</a>
    </div>
</section>
{{ end }}

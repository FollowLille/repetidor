{{ define "content" }}
<section class="card">
    <h2>{{ tr .Locale "Edit topic" }}: {{ .OriginalName }}</h2>

    {{ if .Error }}
    <p class="form_error">{{ tr .Locale .Error }}</p>
    {{ end }}

    <form method="post" action="/topics/{{ .OriginalName }}/edit" class="topic_form">
        <div class="form_group">
            <label for="topic_name">{{ tr .Locale "Name" }}</label>
            <input id="topic_name" class="form_input" type="text" name="name" value="{{ .Topic.Name }}" required>
        </div>

        <div class="form_group">
            <label for="topic_description">{{ tr .Locale "Description" }}</label>
            <textarea id="topic_description" class="form_textarea" name="description" rows="4">{{ .Topic.Description }}</textarea>
        </div>

        <button class="mode_button" type="submit">{{ tr .Locale "Save changes" }}</button>
    </form>

    <form method="post" action="/topics/{{ .OriginalName }}/delete" onsubmit="return confirm('{{ tr .Locale "Delete this topic?" }}');">
        <button class="danger_button" type="submit">{{ tr .Locale "Delete topic" }}</button>
    </form>

    <div class="page_actions">
        <a class="secondary_link" href="/topics/{{ .OriginalName }}">{{ tr .Locale "Back to topic" }}</a>
        <a class="secondary_link" href="/topics">{{ tr .Locale "Back to topics" }}</a>
        <a class="secondary_link" href="/">{{ tr .Locale "Back to home" }}</a>
    </div>
</section>
{{ end }}

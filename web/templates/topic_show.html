{{ define "content" }}
<section class="card">
    <h2>Topic: {{ .Topic.Name }}</h2>
    <p class="muted">{{ .Topic.Description }}</p>

    <div class="page_actions">
        <a class="secondary_link" href="/topics/{{ .Topic.Name }}/edit">Edit topic</a>
        <a class="secondary_link" href="/topics">← Back to topics</a>
        <a class="secondary_link" href="/">Back to home</a>
    </div>
</section>
{{ end }}

name: Materialize Spanish First Steps content

on:
  push:
    branches:
      - ira/spanish-first-steps-content
    paths:
      - '.github/spanish-first-steps-payload/**'
      - '.github/workflows/materialize-spanish-first-steps.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ira/spanish-first-steps-content
          fetch-depth: 0

      - name: Reassemble and extract content pack
        shell: bash
        run: |
          set -euo pipefail
          cat .github/spanish-first-steps-payload/part* > /tmp/spanish-first-steps.b64
          base64 --decode /tmp/spanish-first-steps.b64 > /tmp/spanish-first-steps.tar.xz
          echo '127a5e77bdda3e7be61cfd22fc64c499d3e23c4c9b2d6b8b5e6e1a88c72c9133  /tmp/spanish-first-steps.tar.xz' | sha256sum --check
          tar -xJf /tmp/spanish-first-steps.tar.xz
          test -f content/spanish-first-steps/manifest.json
          test -f content/spanish-first-steps/07-indefinido.json

      - name: Commit materialized content
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/spanish-first-steps-payload
          rm -f .github/workflows/materialize-spanish-first-steps.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Spanish First Steps content pack'
          git push origin HEAD:ira/spanish-first-steps-content
